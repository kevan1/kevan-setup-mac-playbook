---
configure_dotfiles: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
- TV
- Podcasts
- 'App Store'
- 'Sublime Text'
dockitems_persist:
- name: "Finder"
  path: "/System/Library/CoreServices/Finder.app/"
  pos: 1
- name: "Launchpad"
  path: "/System/Applications/Launchpad.app/"
  pos: 2
- name: "Dia"
  path: "/Applications/Dia.app/"
  pos: 3
- name: "Messages"
  path: "/System/Applications/Messages.app/"
  pos: 4
- name: "Mail"
  path: "/System/Applications/Mail.app/"
  pos: 5
- name: "Calendar"
  path: "/System/Applications/Calendar.app/"
  pos: 6
- name: "Ghostty"
  path: "/Applications/Ghostty.app/"
  pos: 7
- name: "Visual Studio Code"
  path: "/Applications/Visual Studio Code.app/"
  pos: 8
- name: "Spotify"
  path: "/Applications/Spotify.app/"
  pos: 9
- name: "System Settings"
  path: "/System/Applications/System Settings.app/"
  pos: 10
dockitems_persist_others:
- name: "Downloads"
  path: "~/Downloads"
  arrange: name
  displayas: folder
  showas: stack


configure_sudoers: false
sudoers_custom_config: ""
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
dotfiles_repo_version: master # Replace with your default branch
dotfiles_files:
  - .zshrc
  - .gitignore
  - .inputrc
  - .osx
  - .vimrc

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - aiken-lang/tap/aikup
  - autoconf
  - anomalyco/tap/opencode
  - automake
  - bash-completion
  - bats-core
  - cloudflared
  - cmake
  - cocoapods
  - dfu-util
  - docker
  - dockutil
  - doxygen
  - fastfetch
  - fastlane
  - ffmpeg
  - fzf
  - gettext
  - gifsicle
  - git
  - gh
  - go
  - gitleaks
  - gnupg
  - hcloud
  - httpie
  - infisical/get-cli/infisical
  - iperf
  - libevent
  - libxml2
  - mactop
  - mise
  - mobile-dev-inc/tap/maestro
  - mole
  - ncdu
  - ninja
  - nmap
  - node
  - nvm
  - openssl@3
  - pgvector
  - php
  - pkgconf
  - pngpaste
  - pnpm
  - postgresql@16
  - pv
  - rclone
  - ssh-copy-id
  - readline
  - redis
  - shellcheck
  - solana
  - sqlite
  - txpipe/tap/tx3up
  - watchman
  - wget
  - wrk
  - ykman
  - yq
  - zoxide
  - zsh-history-substring-search

homebrew_taps:
  - aiken-lang/tap
  - anomalyco/tap
  - infisical/get-cli
  - mobile-dev-inc/tap
  - txpipe/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - arc
  - bitwarden
  - claude-code
  - cleanmymac
  - daisydisk
  - deepl
  - docker-desktop
  - flux-markdown
  - gcloud-cli
  - github
  - ghostty
  - google-chrome
  - google-drive
  - linearmouse
  - middle
  - middleclick
  - mitmproxy
  - ngrok
  - opencode-desktop
  - orbstack
  - raycast
  - spotify
  - surfshark
  - tailscale-app
  - telegram
  - the-unarchiver
  - thebrowsercompany-dia
  - transmission
  - visual-studio-code
  - vlc
  - windows-app
  - zulu@17


# See `geerlingguy.mac.mas` role documentation for usage instructions.
mas_installed_apps: []
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
